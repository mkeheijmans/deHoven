<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>de Hoven Noord: Sprint 1 (R1)</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --ink: #1c2127; --muted: #5f6b76;
    --line: #dde2e7; --accent: #1f6feb; --dim: #cfd6dd; --sel: #e8590c; --accent2: #eb6834;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --panel: #1a1f25; --ink: #e6edf3; --muted: #9aa7b3;
      --line: #2d343c; --accent: #58a6ff; --dim: #353d46; --sel: #ff8a3d; --accent2: #d95926;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; }
  .brand { color: var(--ink); font-size: 26px; font-weight: 700; letter-spacing: -.01em; margin: 0 0 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .brand span { color: var(--muted); font-weight: 400; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  .muted { color: var(--muted); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }

  .top { display: grid; grid-template-columns: 300px 1fr; gap: 16px; margin-bottom: 16px; align-items: start; }
  @media (max-width: 860px) { .top { grid-template-columns: 1fr; } .viewer { order: -1; } }

  .slider { margin-bottom: 16px; }
  .slider label { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 4px; }
  .slider output { font-variant-numeric: tabular-nums; color: var(--accent); }
  .slider input { width: 100%; accent-color: var(--accent); }
  .ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td { padding: 5px 0; border-top: 1px solid var(--line); }
  td:last-child { text-align: right; font-weight: 600; }

  .viewer { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
  .viewer img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #000; cursor: zoom-in; }
  .viewer .cap { padding: 10px 16px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  .pc-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .pc-scroll { overflow-x: auto; }
  #pc { display: block; min-width: 900px; width: 100%; height: 340px; user-select: none; touch-action: none; }
  #pc .ln { fill: none; stroke: var(--accent); stroke-width: 1.2; stroke-opacity: .35; }
  #pc .ln.off { stroke: var(--dim); stroke-opacity: .5; }
  #pc .ln.sel { stroke: var(--sel); stroke-width: 3; stroke-opacity: 1; }
  #pc .axis { stroke: var(--muted); stroke-width: 1; }
  #pc text { fill: var(--ink); font-size: 11px; }
  #pc .tick { fill: var(--muted); font-size: 10px; paint-order: stroke; stroke: var(--panel); stroke-width: 3px; stroke-linejoin: round; }
  #pc .brush { fill: var(--accent); fill-opacity: .18; stroke: var(--accent); }
  #pc .hit { fill: transparent; cursor: ns-resize; }

  button { font: inherit; color: inherit; }
  .btn { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 16px; }
  .thumb { padding: 0; border: 2px solid transparent; border-radius: 8px; overflow: hidden; background: var(--panel); cursor: pointer; text-align: left; }
  .thumb.sel { border-color: var(--sel); }
  .thumb img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: var(--line); }
  .thumb span { display: block; padding: 6px 8px; font-size: 12px; color: var(--muted); }

  .section { margin-bottom: 16px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tools input { width: 110px; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 4px 0 16px; }
  .kpi { background: var(--bg); border-radius: 8px; padding: 12px 14px; }
  .kpi b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .band-chart { overflow-x: auto; }
  .band-chart svg { display: block; width: 100%; height: auto; min-width: 560px; max-width: 760px; }
  table.band { margin-top: 12px; }
  table.band th { text-align: left; font-weight: 600; color: var(--muted); padding: 6px 12px 6px 0; }
  table.band td { padding: 6px 12px 6px 0; }
  table.band td:nth-child(n+2), table.band th:nth-child(n+2) { text-align: right; }
  table.band.first2 td:nth-child(2), table.band.first2 th:nth-child(2) { text-align: left; }
  table.band tr.total td { font-weight: 600; border-top: 2px solid var(--line); }
  .band-scroll { overflow-x: auto; }
  .note { font-size: 12px; margin: 10px 0 0; }
  .band-sec { padding: 0; }
  .band-sec > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .band-sec > summary::-webkit-details-marker { display: none; }
  .band-sec > summary::before { content: '▸'; color: var(--muted); width: 12px; }
  .band-sec[open] > summary::before { content: '▾'; }
  .band-sec > summary h2 { margin: 0; }
  .band-sec > summary .headline { font-size: 13px; }
  .band-sec > :not(summary) { margin-left: 16px; margin-right: 16px; }
  .band-sec > :last-child { margin-bottom: 16px; }
  .band-tools { margin-bottom: 12px; }

  dialog { border: 0; padding: 0; background: #000; max-width: 96vw; max-height: 96vh; }
  dialog img { display: block; max-width: 96vw; max-height: 96vh; }
  dialog::backdrop { background: rgba(0,0,0,.8); }
  .err { color: var(--sel); }
</style>
</head>
<body>
<div class="wrap">
  <p class="brand">Heijmans Wonen: <span>Inzichten Platform</span></p>
  <header>
    <h1>de Hoven Noord: Sprint 1 (R1)</h1>
    <span class="muted" id="count"></span>
  </header>

  <div class="top">
    <div class="card">
      <h2>Invoer</h2>
      <div id="sliders"></div>
      <h2 style="margin-top:20px">Resultaat</h2>
      <table id="outputs"></table>
    </div>
    <div class="card viewer">
      <img id="main" alt="Geselecteerde variant">
      <div class="cap"><strong id="title"></strong><span class="muted">Klik op de afbeelding om te vergroten</span></div>
    </div>
  </div>

  <div id="bands"></div>

  <div class="card">
    <div class="pc-head">
      <h2>Alle varianten</h2>
      <span class="muted">Sleep verticaal over een as om te filteren · sleep het filter om het te verschuiven · klik om te wissen
        <button class="btn" id="reset">Wis filters</button></span>
    </div>
    <div class="pc-scroll"><svg id="pc"></svg></div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<dialog id="zoom"><img alt=""></dialog>

<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';

  // --- data ----------------------------------------------------------------
  let text;
  try {
    const res = await fetch('data.csv', { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
    text = await res.text();
  } catch (e) {
    $('count').innerHTML = '<span class="err">Kon data.csv niet laden (' + e.message +
      '). Open deze pagina via GitHub Pages of een lokale webserver, niet als bestand.</span>';
    return;
  }

  const lines = text.trim().split(/\r?\n/);
  const head = lines[0].split(',');
  const cols = head.map((h, i) => {
    const m = h.match(/^(in|out):(.*)$/);
    return { i, kind: m ? m[1] : (h.trim() === 'img' ? 'img' : 'other'), name: m ? m[2].trim() : h.trim() };
  });
  const imgCol = cols.find((c) => c.kind === 'img');
  const dims = cols.filter((c) => c.kind === 'in' || c.kind === 'out');
  const inputs = dims.filter((c) => c.kind === 'in');
  const outs = dims.filter((c) => c.kind === 'out');

  const rows = lines.slice(1).map((l, idx) => {
    const raw = l.split(',').map((s) => s.trim());
    return {
      idx, raw,
      num: raw.map((v) => parseFloat(v.replace('%', ''))),
      img: imgCol ? raw[imgCol.i] : null,
    };
  });

  for (const d of dims) {
    // Text columns (e.g. "Sociaal 3v") become categories, ordered by first appearance.
    if (rows.some((r) => r.raw[d.i] !== '' && isNaN(Number(r.raw[d.i].replace('%', ''))))) {
      d.cats = [...new Set(rows.map((r) => r.raw[d.i]))];
      rows.forEach((r) => { r.num[d.i] = d.cats.indexOf(r.raw[d.i]); });
    }
    const vals = rows.map((r) => r.num[d.i]).filter((v) => !isNaN(v));
    d.min = Math.min(...vals);
    d.max = Math.max(...vals);
    d.pct = rows.some((r) => r.raw[d.i].endsWith('%'));
    d.uniq = [...new Set(vals)].sort((a, b) => a - b);
  }

  // Display-only renames; the CSV and the URL hash keep the raw values.
  const VALUE_ALIAS = { Dijkzone: { '0': 'leeg' } };
  const show = (d, raw) => (VALUE_ALIAS[d.name] && VALUE_ALIAS[d.name][raw]) || raw;
  const fmt = (d, v) => (d.cats ? show(d, d.cats[Math.round(v)]) : d.pct ? +v.toFixed(1) + '%' : +v.toFixed(2) + '');
  const imgUrl = (r) => encodeURIComponent(r.img);
  const label = (r) => inputs.map((d) => d.name + ' ' + show(d, r.raw[d.i])).join(' · ');

  // --- state ---------------------------------------------------------------
  let sel = rows[0];
  const brushes = {}; // dim index -> [lo, hi] in data units
  const passes = (r) => Object.entries(brushes).every(([i, [lo, hi]]) => r.num[i] >= lo && r.num[i] <= hi);

  // --- sliders -------------------------------------------------------------
  for (const d of inputs) {
    const el = document.createElement('div');
    el.className = 'slider';
    el.innerHTML =
      `<label>${d.name} <output></output></label>` +
      `<input type="range" min="0" max="${d.uniq.length - 1}" step="1">` +
      `<div class="ticks"><span>${fmt(d, d.min)}</span><span>${fmt(d, d.max)}</span></div>`;
    d.input = el.querySelector('input');
    d.output = el.querySelector('output');
    d.input.addEventListener('input', () => {
      const want = inputs.map((x) => x.uniq[+x.input.value]);
      const hit = rows.find((r) => inputs.every((x, k) => r.num[x.i] === want[k]));
      if (hit) select(hit);
      else d.output.textContent = fmt(d, want[inputs.indexOf(d)]) + ' (geen variant)';
    });
    $('sliders').appendChild(el);
  }

  // --- selection -----------------------------------------------------------
  function select(r, opts = {}) {
    sel = r;
    $('main').src = imgUrl(r);
    $('title').textContent = label(r);
    for (const d of inputs) {
      d.input.value = d.uniq.indexOf(r.num[d.i]);
      d.output.textContent = show(d, r.raw[d.i]);
    }
    $('outputs').innerHTML = outs.map((d) => `<tr><td>${d.name}</td><td>${r.raw[d.i]}</td></tr>`).join('');
    paths.forEach((p, k) => p.classList.toggle('sel', k === r.idx));
    if (paths[r.idx]) paths[r.idx].parentNode.appendChild(paths[r.idx]); // bring to front
    document.querySelectorAll('.thumb').forEach((t) => t.classList.toggle('sel', +t.dataset.idx === r.idx));
    history.replaceState(null, '', '#' + inputs.map((d) => encodeURIComponent(d.name) + '=' + encodeURIComponent(r.raw[d.i])).join('&'));
    if (opts.scroll) document.querySelector('.top').scrollIntoView({ behavior: 'smooth' });
  }

  // --- parallel coordinates ------------------------------------------------
  const svg = $('pc');
  let paths = [];
  let geom = null;

  function draw() {
    const W = svg.clientWidth, H = svg.clientHeight;
    const m = { t: 44, r: 50, b: 24, l: 50 };
    const step = (W - m.l - m.r) / Math.max(1, dims.length - 1);
    const y = (d, v) => (d.max === d.min ? (m.t + H - m.b) / 2 : m.t + (1 - (v - d.min) / (d.max - d.min)) * (H - m.t - m.b));
    const inv = (d, py) => d.min + (1 - (py - m.t) / (H - m.t - m.b)) * (d.max - d.min);
    geom = { m, H, y, inv, x: (k) => m.l + k * step };
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.innerHTML = '';

    const gl = document.createElementNS(NS, 'g');
    paths = rows.map((r) => {
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('d', dims.map((d, k) => (k ? 'L' : 'M') + geom.x(k) + ',' + y(d, r.num[d.i])).join(''));
      p.setAttribute('class', 'ln');
      gl.appendChild(p);
      return p;
    });
    svg.appendChild(gl);

    dims.forEach((d, k) => {
      const x = geom.x(k);
      const g = document.createElementNS(NS, 'g');
      g.innerHTML =
        `<line class="axis" x1="${x}" x2="${x}" y1="${m.t}" y2="${H - m.b}"/>` +
        `<text x="${x}" y="${m.t - 24}" text-anchor="middle" font-weight="600">${d.name}</text>` +
        `<text x="${x}" y="${m.t - 10}" text-anchor="middle" class="tick">${d.kind === 'in' ? 'invoer' : 'uitvoer'}</text>`;
      const ticks = (d.kind === 'in' || d.cats) && d.uniq.length <= 12 ? d.uniq : [d.min, d.max];
      for (const v of ticks) {
        g.innerHTML += `<text class="tick" x="${x + 5}" y="${y(d, v) + 3}">${fmt(d, v)}</text>`;
      }
      const br = document.createElementNS(NS, 'rect');
      br.setAttribute('class', 'brush');
      br.setAttribute('x', x - 8);
      br.setAttribute('width', 16);
      g.appendChild(br);
      const hit = document.createElementNS(NS, 'rect');
      hit.setAttribute('class', 'hit');
      hit.setAttribute('x', x - 14);
      hit.setAttribute('width', 28);
      hit.setAttribute('y', m.t - 6);
      hit.setAttribute('height', H - m.t - m.b + 12);
      g.appendChild(hit);
      d.brushRect = br;
      bindBrush(hit, d);
      svg.appendChild(g);
    });
    applyFilter();
    select(sel);
  }

  function svgY(ev) {
    const pt = svg.createSVGPoint();
    pt.x = ev.clientX; pt.y = ev.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse()).y;
  }

  // Drag outside the range draws a new one; drag inside it moves it; a click without dragging clears it.
  function bindBrush(hit, d) {
    let y0 = null, moveFrom = null; // moveFrom = [top, bottom] in px when moving an existing range
    const rangePx = () => brushes[d.i] && [geom.y(d, brushes[d.i][1]), geom.y(d, brushes[d.i][0])];
    const inside = (y) => { const r = rangePx(); return r && y >= r[0] && y <= r[1]; };
    hit.addEventListener('pointerdown', (ev) => {
      y0 = svgY(ev);
      moveFrom = inside(y0) ? rangePx() : null;
      hit.setPointerCapture(ev.pointerId);
    });
    hit.addEventListener('pointermove', (ev) => {
      const y1 = svgY(ev);
      if (y0 === null) { hit.style.cursor = inside(y1) ? 'move' : ''; return; }
      if (Math.abs(y1 - y0) < 3) return;
      const lo = geom.m.t, hi = geom.H - geom.m.b;
      let top, bot;
      if (moveFrom) {
        const dy = Math.min(Math.max(y1 - y0, lo - moveFrom[0]), hi - moveFrom[1]);
        top = moveFrom[0] + dy; bot = moveFrom[1] + dy;
      } else {
        const c = (v) => Math.min(Math.max(v, lo), hi);
        top = c(Math.min(y0, y1)); bot = c(Math.max(y0, y1));
      }
      brushes[d.i] = [geom.inv(d, bot), geom.inv(d, top)];
      applyFilter();
    });
    hit.addEventListener('pointerup', (ev) => {
      if (y0 !== null && Math.abs(svgY(ev) - y0) < 3) { delete brushes[d.i]; applyFilter(); }
      y0 = moveFrom = null;
    });
  }

  function applyFilter() {
    for (const d of dims) {
      const b = brushes[d.i];
      if (!b || d.max === d.min) { d.brushRect.setAttribute('height', 0); continue; }
      const top = geom.y(d, b[1]), bot = geom.y(d, b[0]);
      d.brushRect.setAttribute('y', top);
      d.brushRect.setAttribute('height', Math.max(2, bot - top));
    }
    const on = rows.filter(passes);
    rows.forEach((r) => paths[r.idx].classList.toggle('off', !passes(r)));
    $('count').textContent = on.length + ' van ' + rows.length + ' varianten';
    renderGrid(on);
  }

  // --- thumbnail grid ------------------------------------------------------
  let gridKey = '';
  function renderGrid(on) {
    const key = on.map((r) => r.idx).join(',');
    if (key === gridKey) return;
    gridKey = key;
    $('grid').innerHTML = on.map((r) =>
      `<button class="thumb${r === sel ? ' sel' : ''}" data-idx="${r.idx}">` +
      `<img loading="lazy" decoding="async" src="${imgUrl(r)}" alt="">` +
      `<span>${label(r)}</span></button>`).join('');
  }
  $('grid').addEventListener('click', (ev) => {
    const t = ev.target.closest('.thumb');
    if (t) select(rows[+t.dataset.idx], { scroll: true });
  });

  $('reset').addEventListener('click', () => {
    for (const k in brushes) delete brushes[k];
    applyFilter();
  });

  $('main').addEventListener('click', () => {
    $('zoom').querySelector('img').src = $('main').src;
    $('zoom').showModal();
  });
  $('zoom').addEventListener('click', () => $('zoom').close());

  // --- bandbreedte inzichten -------------------------------------------------
  // One fold-out section per entry. view 'band' (default): per input the spread of an output's mean over that
  // input's settings, averaged over the other inputs. 'steps': the effect of each step of one input.
  // 'scenarios': per setting of one input, the outputs and their range over a second input.
  const BANDS = [
    { key: 'groen', title: 'Bandbreedte inzichten groen', kpis: ['Groen'], area: true,
      note: 'Per knop: verschil in gemiddeld groen tussen de laagste en de hoogste stand van die knop, gemiddeld over ' +
            'alle combinaties van de andere knoppen. m² = procentpunten × totaal plangebied.' },
    { key: 'parkeren', title: 'Bandbreedte inzichten parkeren', kpis: ['PP Vergroend', 'PP Tekort'], view: 'steps',
      by: 'PNorm', descending: true, extra: 'Groen' },
    { key: 'woningen', title: 'Bandbreedte inzichten woningen', kpis: ['Dijkzone Appt', 'Dijkzone PP'], view: 'scenarios',
      by: 'Dijkzone', vary: 'PNorm' },
  ];
  const LONG_NAME = { PNorm: 'Parkeernorm (%)', Kavel: 'Kavelverkleining (%)', Dijkzone: 'Bebouwing dijkzone' };
  const KPI_NAME = { 'Dijkzone Appt': 'Extra woningen (dijkzone)', 'Dijkzone PP': 'Extra parkeerplaatsen (dijkzone)' };
  const KPI_UNIT = { 'Dijkzone Appt': 'woningen' }; // counts default to PP
  const kname = (k) => KPI_NAME[k.name] || k.name;
  const LIGHT = { bg: '#ffffff', ink: '#1c2127', muted: '#5f6b76', bar: '#1f6feb', bar2: '#eb6834', axis: '#c3c9d0' };
  const DEFAULT_AREA = 330860; // totaal plangebied in m², ook zichtbaar in de renders van deze run
  const run = location.pathname.split('/').filter(Boolean).pop() || 'run';
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const nl1 = (x) => x.toLocaleString('nl-NL', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const nl0 = (x) => Math.round(x).toLocaleString('nl-NL');
  const sgn = (x, f) => (Math.round(x * 10) === 0 ? '±' : x > 0 ? '+' : '−') + f(Math.abs(x));
  const areaKey = 'band-area:' + location.pathname;
  let area = parseFloat(new URLSearchParams(location.search).get('opp'));
  if (!(area > 0)) { try { area = parseFloat(localStorage.getItem(areaKey)); } catch (e) { area = NaN; } }
  if (!(area > 0)) area = DEFAULT_AREA > 0 ? DEFAULT_AREA : null;
  const m2 = (pp) => (area ? (pp * area) / 100 : null);
  const col = (name) => dims.find((d) => d.name === name);
  const avg = (xs) => xs.reduce((a, b) => a + b, 0) / xs.length;
  // Mean of output k over the rows matching every [input, value] pair.
  const meanWhere = (k, ...pairs) => avg(rows.filter((r) => pairs.every(([d, v]) => r.num[d.i] === v)).map((r) => r.num[k.i]));

  // Value text for a KPI: percentages as pp (+ m² when the area is known), counts as whole numbers.
  const amount = (k, x) => (k.pct ? '+' + nl1(x) + ' pp' + (area ? ' · +' + nl0(m2(x)) + ' m²' : '') : '+' + nl0(x) + ' ' + (KPI_UNIT[k.name] || 'PP'));
  const level = (k, x) => (k.pct ? nl1(x) + '%' : nl0(x));

  function svgWrap(W, H, pal, body) {
    return `<svg xmlns="${NS}" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="Segoe UI, Arial, sans-serif">` +
      (pal.bg ? `<rect width="${W}" height="${H}" fill="${pal.bg}"/>` : '') + body + '</svg>';
  }
  // Horizontal bar with a rounded data end and a square baseline end.
  const barPath = (x, y, w, h, fill) => {
    const r = Math.min(4, w / 2), run = +(w - r).toFixed(1);
    return `<path d="M${x},${y}h${run}a${r},${r} 0 0 1 ${r},${r}v${h - 2 * r}a${r},${r} 0 0 1 -${r},${r}h${-run}z" fill="${fill}"/>`;
  };
  const txt = (x, y, size, fill, s, bold, anchor) =>
    `<text x="${x}" y="${y}" font-size="${size}"${bold ? ' font-weight="600"' : ''}${anchor ? ` text-anchor="${anchor}"` : ''} fill="${fill}">${esc(s)}</text>`;
  const legend = (pal, entries) => entries.map(([color, label], j) =>
    `<rect x="${j * 300}" y="4" width="12" height="12" rx="2" fill="${color}"/>` + txt(j * 300 + 18, 14, 12, pal.muted, label)).join('');

  // Inline styles only for the clipboard copy, so PowerPoint keeps the formatting; on the page CSS does it.
  function tableKit(inline, firstNum) {
    const st = inline ? { t: ' style="border-collapse:collapse;font-family:Segoe UI,Arial,sans-serif;font-size:14px"',
      th: ' style="text-align:left;padding:6px 12px;border-bottom:2px solid #1c2127"',
      td: ' style="text-align:left;padding:6px 12px;border-bottom:1px solid #dde2e7"',
      tot: ' style="text-align:left;padding:6px 12px;font-weight:bold;border-top:2px solid #1c2127;border-bottom:1px solid #dde2e7"' }
      : { t: '', th: '', td: '', tot: '' };
    const cell = (tag, attr, v, right) => `<${tag}${right && inline ? attr.replace('text-align:left', 'text-align:right') : attr}>${esc(v)}</${tag}>`;
    const row = (tag, attr, cells, cls) => `<tr${cls ? ` class="${cls}"` : ''}>` + cells.map((x, j) => cell(tag, attr, x, j >= firstNum)).join('') + '</tr>';
    return { st, row, open: (head) => `<table${st.t}><thead>` + row('th', st.th, head) + '</thead><tbody>', close: '</tbody></table>' };
  }

  // ---- view 'band' ----
  function bandItems(k) {
    return inputs.map((d) => {
      const ms = d.uniq.map((v) => ({ v, m: meanWhere(k, [d, v]) }));
      // With ties (e.g. PP Tekort is 0 for norms 0-75) take the tied setting nearest the other end: "75 → 100", not "0 → 100".
      const lowest = Math.min(...ms.map((x) => x.m)), highest = Math.max(...ms.map((x) => x.m));
      const nearest = (val, ref) => ms.filter((x) => Math.abs(x.m - val) < 1e-9)
        .reduce((a, b) => (Math.abs(ms.indexOf(b) - ref) < Math.abs(ms.indexOf(a) - ref) ? b : a));
      const hi0 = ms.find((x) => x.m === highest);
      const lo = nearest(lowest, ms.indexOf(hi0));
      const hi = nearest(highest, ms.indexOf(lo));
      return { name: LONG_NAME[d.name] || d.name, from: fmt(d, lo.v), to: fmt(d, hi.v), lo: lo.m, hi: hi.m, span: hi.m - lo.m };
    }).sort((a, b) => b.span - a.span);
  }

  const bandView = {
    headline(b, ks) {
      const k = ks[0], best = bandItems(k)[0];
      return best.span > 0 ? 'Grootste knop: ' + best.name + ' ' + amount(k, best.span) : '';
    },
    chart(b, ks, pal) {
      const W = 720, rowH = 50, labW = 220, valW = 210, bw = W - labW - valW;
      const groups = ks.map((k) => ({ k, items: bandItems(k) })), multi = groups.length > 1;
      const max = Math.max(...groups.flatMap((g) => g.items.map((it) => it.span))) || 1;
      let y = 6, body = '';
      for (const g of groups) {
        if (multi) { body += txt(0, y + 20, 15, pal.ink, kname(g.k), true); y += 30; }
        const y0 = y;
        for (const it of g.items) {
          const w = it.span > 0 ? Math.max(6, Math.round((it.span / max) * bw * 10) / 10) : 0;
          body += txt(0, y + 20, 14, pal.ink, it.name, true) + txt(0, y + 38, 12, pal.muted, it.span > 0 ? it.from + ' → ' + it.to : '');
          if (w) body += barPath(labW, y + 14, w, 22, pal.bar);
          body += txt(labW + w + 10, y + 30, 13, it.span > 0 ? pal.ink : pal.muted, it.span > 0 ? amount(g.k, it.span) : 'geen effect', true);
          y += rowH;
        }
        body += `<line x1="${labW}" x2="${labW}" y1="${y0}" y2="${y - 6}" stroke="${pal.axis}"/>`;
        if (multi) y += 10;
      }
      return { s: svgWrap(W, y + 6, pal, body), W, H: y + 6 };
    },
    table(b, ks, inline) {
      const k = ks[0], span = k.max - k.min, { st, row, open, close } = tableKit(inline, 2);
      let h = open(['Knop', 'Van → naar (meer ' + kname(k).toLowerCase() + ')', kname(k) + ' (pp)']
        .concat(area ? [kname(k) + ' (m²)'] : [], ['Aandeel in bandbreedte']));
      for (const it of bandItems(k)) {
        h += row('td', st.td, [it.name, it.from + ' → ' + it.to, '+' + nl1(it.span)]
          .concat(area ? ['+' + nl0(m2(it.span))] : [], [(span ? Math.round((it.span / span) * 100) : 0) + '%']));
      }
      h += row('td', st.tot, ['Totale bandbreedte (alle varianten)', nl1(k.min) + '% → ' + nl1(k.max) + '%', '+' + nl1(span)]
        .concat(area ? ['+' + nl0(m2(span))] : [], ['100%']), 'total');
      return h + close;
    },
  };

  // ---- view 'steps': absolute values per setting of one input (parkeernorm 100 → 75 → … → 0) ----
  // kpis[0] is drawn as the main bar, kpis[1] as a second bar only where it is non-zero (e.g. a shortage).
  function stepData(b, ks) {
    const d = col(b.by), g = b.extra && col(b.extra);
    const lv = b.descending ? [...d.uniq].reverse() : d.uniq;
    const at = (k, v) => meanWhere(k, [d, v]);
    return lv.map((v, j) => ({
      label: fmt(d, v) + (d.name === 'PNorm' ? '%' : ''),
      vals: ks.map((k) => at(k, v)),
      step: j ? at(ks[0], v) - at(ks[0], lv[j - 1]) : null,
      g: g ? at(g, v) - at(g, lv[0]) : null, // gain relative to the first setting
    }));
  }
  const stepsView = {
    headline(b, ks) {
      const st = stepData(b, ks), first = st[0], last = st[st.length - 1];
      const short = st.filter((s) => s.vals[1] > 0);
      return `${first.label} → ${last.label}: ${nl0(first.vals[0])} → ${nl0(last.vals[0])} PP vergroend` +
        (area && last.g ? ` (${sgn(m2(last.g), nl0)} m² groen)` : '') +
        (short.length ? ` · tekort alleen bij ${short.map((s) => s.label).join(', ')}` : '');
    },
    chart(b, ks, pal) {
      const st = stepData(b, ks), name = (LONG_NAME[b.by] || b.by).replace(/ \(%\)$/, '');
      const W = 720, rowH = 58, labW = 190, valW = 170, bw = W - labW - valW, top = 30;
      const max = Math.max(...st.flatMap((s) => s.vals)) || 1;
      const len = (x) => (x > 0 ? Math.max(6, Math.round((x / max) * bw * 10) / 10) : 0);
      let y = top, body = legend(pal, [[pal.bar, kname(ks[0])], [pal.bar2, kname(ks[1])]]);
      for (const s of st) {
        const sub = s.g ? sgn(s.g, nl1) + ' pp groen' + (area ? ' · ' + sgn(m2(s.g), nl0) + ' m²' : '') : 'uitgangssituatie';
        body += txt(0, y + 18, 14, pal.ink, name + ' ' + s.label, true) + txt(0, y + 36, 12, pal.muted, sub);
        const w = len(s.vals[0]);
        if (w) body += barPath(labW, y + 6, w, 18, pal.bar);
        body += txt(labW + w + 8, y + 20, 13, s.vals[0] > 0 ? pal.ink : pal.muted, nl0(s.vals[0]) + ' ' + kname(ks[0]), true);
        if (s.vals[1] > 0) {
          const w2 = len(s.vals[1]);
          body += barPath(labW, y + 30, w2, 14, pal.bar2) + txt(labW + w2 + 8, y + 42, 13, pal.ink, nl0(s.vals[1]) + ' ' + kname(ks[1]), true);
        }
        y += rowH;
      }
      body += `<line x1="${labW}" x2="${labW}" y1="${top}" y2="${y - 8}" stroke="${pal.axis}"/>`;
      return { s: svgWrap(W, y + 4, pal, body), W, H: y + 4 };
    },
    table(b, ks, inline) {
      const st = stepData(b, ks), g = b.extra && col(b.extra), { st: sty, row, open, close } = tableKit(inline, 1);
      let h = open([LONG_NAME[b.by] || b.by, kname(ks[0]), 'Erbij t.o.v. vorige stap', kname(ks[1])]
        .concat(g ? ['Extra groen t.o.v. ' + st[0].label + ' (pp)'] : [], g && area ? ['Extra groen (m²)', 'm² groen per vergroende PP'] : []));
      for (const s of st) {
        const perPP = s.vals[0] - st[0].vals[0];
        h += row('td', sty.td, [s.label, nl0(s.vals[0]), s.step === null ? '–' : sgn(s.step, nl0), nl0(s.vals[1])]
          .concat(g ? [s.g ? sgn(s.g, nl1) : '–'] : [], g && area ? [s.g ? sgn(m2(s.g), nl0) : '–', perPP ? nl1(m2(s.g) / perPP) : '–'] : []));
      }
      return h + close;
    },
  };

  // ---- view 'scenarios': per bouwtype the homes (bar) and the parking range over the parkeernorm (range bar) ----
  function scenarioData(b, ks) {
    const d = col(b.by), vd = col(b.vary), vlo = vd.uniq[0], vhi = vd.uniq[vd.uniq.length - 1];
    return d.uniq.map((v) => ({
      name: fmt(d, v),
      homes: meanWhere(ks[0], [d, v]),
      ppLo: meanWhere(ks[1], [d, v], [vd, vlo]), ppHi: meanWhere(ks[1], [d, v], [vd, vhi]),
    })).concat().sort((a, c) => a.homes - c.homes || a.ppHi - c.ppHi);
  }
  const scenarioView = {
    headline(b, ks) {
      const sc = scenarioData(b, ks).filter((s) => s.homes > 0);
      if (!sc.length) return '';
      const hs = sc.map((s) => s.homes), ps = sc.flatMap((s) => [s.ppLo, s.ppHi]);
      return `${nl0(Math.min(...hs))}–${nl0(Math.max(...hs))} extra woningen · ${nl0(Math.min(...ps))}–${nl0(Math.max(...ps))} extra PP`;
    },
    chart(b, ks, pal) {
      const sc = scenarioData(b, ks), vd = col(b.vary);
      const vname = (LONG_NAME[b.vary] || b.vary).replace(/ \(%\)$/, '').toLowerCase();
      const W = 720, blockH = 64, labW = 170, valW = 230, bw = W - labW - valW, top = 30;
      const max = Math.max(...sc.flatMap((s) => [s.homes, s.ppLo, s.ppHi])) || 1;
      const x = (v) => labW + (v / max) * bw;
      let y = top, body = legend(pal, [[pal.bar, 'Extra woningen'],
        [pal.bar2, `Extra parkeerplaatsen: ${vname} ${fmt(vd, vd.uniq[0])}% → ${fmt(vd, vd.uniq[vd.uniq.length - 1])}%`]]);
      for (const s of sc) {
        body += txt(0, y + 26, 14, pal.ink, s.name, true);
        if (s.homes > 0) {
          const pp = s.ppHi / s.homes, pp0 = s.ppLo / s.homes;
          body += txt(0, y + 44, 12, pal.muted, nl1(pp0) + '–' + nl1(pp) + ' PP per woning');
          body += barPath(labW, y + 6, Math.max(6, x(s.homes) - labW), 18, pal.bar) +
                  txt(x(s.homes) + 8, y + 20, 13, pal.ink, nl0(s.homes) + ' woningen', true);
          const x0 = x(Math.min(s.ppLo, s.ppHi)), x1 = x(Math.max(s.ppLo, s.ppHi));
          body += `<rect x="${x0}" y="${y + 36}" width="${Math.max(2, x1 - x0)}" height="10" rx="5" fill="${pal.bar2}" fill-opacity="0.35"/>` +
                  `<circle cx="${x0}" cy="${y + 41}" r="5" fill="${pal.bar2}"/><circle cx="${x1}" cy="${y + 41}" r="5" fill="${pal.bar2}"/>` +
                  txt(x1 + 10, y + 46, 13, pal.ink, nl0(Math.min(s.ppLo, s.ppHi)) + '–' + nl0(Math.max(s.ppLo, s.ppHi)) + ' PP', true);
        } else {
          body += txt(labW + 10, y + 30, 13, pal.muted, 'geen extra woningen of parkeerplaatsen');
        }
        y += blockH;
      }
      body += `<line x1="${labW}" x2="${labW}" y1="${top}" y2="${y - 8}" stroke="${pal.axis}"/>`;
      return { s: svgWrap(W, y + 4, pal, body), W, H: y + 4 };
    },
    table(b, ks, inline) {
      const sc = scenarioData(b, ks), vd = col(b.vary), { st, row, open, close } = tableKit(inline, 1);
      const lo = fmt(vd, vd.uniq[0]) + '%', hi = fmt(vd, vd.uniq[vd.uniq.length - 1]) + '%';
      let h = open([LONG_NAME[b.by] || b.by, 'Extra woningen', `Extra PP bij norm ${hi}`, `Extra PP bij norm ${lo}`,
        'Bandbreedte PP', 'PP per woning']);
      for (const s of sc) {
        h += row('td', st.td, [s.name, nl0(s.homes), nl0(s.ppHi), nl0(s.ppLo), nl0(Math.abs(s.ppHi - s.ppLo)),
          s.homes ? nl1(s.ppLo / s.homes) + '–' + nl1(s.ppHi / s.homes) : '–']);
      }
      return h + close;
    },
  };
  const VIEWS = { band: bandView, steps: stepsView, scenarios: scenarioView };

  function download(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  const flash = (btn, msg) => { const o = btn.textContent; btn.textContent = msg; setTimeout(() => (btn.textContent = o), 1500); };

  async function copyHTML(html, btn) {
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    const plain = [...tmp.querySelectorAll('tr')].map((tr) => [...tr.children].map((c) => c.textContent).join('\t')).join('\n');
    try {
      await navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([html], { type: 'text/html' }),
        'text/plain': new Blob([plain], { type: 'text/plain' }),
      })]);
    } catch (e) {
      tmp.style.cssText = 'position:absolute;left:-9999px';
      document.body.appendChild(tmp);
      const range = document.createRange();
      range.selectNodeContents(tmp);
      getSelection().removeAllRanges();
      getSelection().addRange(range);
      document.execCommand('copy');
      getSelection().removeAllRanges();
      tmp.remove();
    }
    flash(btn, 'Gekopieerd ✓');
  }

  const renders = [];
  for (const b of BANDS) {
    const ks = b.kpis.map(col).filter(Boolean);
    const view = VIEWS[b.view || 'band'];
    const needs = [b.by, b.vary, b.extra].filter(Boolean);
    if (ks.length !== b.kpis.length || !inputs.length || needs.some((n) => !col(n))) continue;
    // Collapsed by default; the open/closed state is remembered per viewer.
    const sec = document.createElement('details');
    sec.className = 'card section band-sec';
    const openKey = 'band-open:' + location.pathname + ':' + b.key;
    try { sec.open = localStorage.getItem(openKey) === '1'; } catch (e) {}
    sec.addEventListener('toggle', () => { try { localStorage.setItem(openKey, sec.open ? '1' : '0'); } catch (e) {} });
    sec.innerHTML =
      `<summary><h2>${esc(b.title)}</h2><span class="muted headline" data-r="headline"></span></summary>` +
      '<div class="tools band-tools">' +
      (b.area ? '<label class="muted">Totaal plangebied <input data-r="area" type="number" min="0" step="1" placeholder="m²"> m²</label>' : '') +
      '<button class="btn" data-r="svg">Grafiek als SVG</button><button class="btn" data-r="png">Grafiek als PNG</button>' +
      '<button class="btn" data-r="copy">Kopieer tabel</button></div>' +
      '<div class="kpis" data-r="kpis"></div><div class="band-chart" data-r="chart"></div>' +
      '<div class="band-scroll"><table class="band" data-r="table"></table></div>' +
      (b.note ? `<p class="muted note">${esc(b.note)}</p>` : '');
    $('bands').appendChild(sec);
    const q = (r) => sec.querySelector(`[data-r="${r}"]`);
    const file = (ext) => `bandbreedte-${b.key}-${run}.${ext}`;

    const render = () => {
      q('headline').textContent = view.headline(b, ks);
      const tile = (lbl, big, small) => `<div class="kpi"><span class="muted">${esc(lbl)}</span><b>${big}</b><span class="muted">${small || '&nbsp;'}</span></div>`;
      if (ks.length === 1 && ks[0].pct) {
        const k = ks[0], span = k.max - k.min;
        q('kpis').innerHTML = tile(k.name + ', laagste variant', nl1(k.min) + '%', area && nl0(m2(k.min)) + ' m²') +
          tile(k.name + ', hoogste variant', nl1(k.max) + '%', area && nl0(m2(k.max)) + ' m²') +
          tile('Maximale winst', '+' + nl1(span) + ' pp', area && '+' + nl0(m2(span)) + ' m²');
      } else {
        q('kpis').innerHTML = ks.map((k) => tile(kname(k), level(k, k.min) + ' – ' + level(k, k.max), 'bereik over alle varianten')).join('');
      }
      const cs = getComputedStyle(document.documentElement), v = (n) => cs.getPropertyValue(n).trim();
      q('chart').innerHTML = view.chart(b, ks, { ink: v('--ink'), muted: v('--muted'), bar: v('--accent'), bar2: v('--accent2'), axis: v('--line') }).s;
      q('table').innerHTML = view.table(b, ks, false).replace(/^<table>|<\/table>$/g, '');
      q('table').classList.toggle('first2', view === bandView); // band table: column 2 is text
    };
    renders.push(render);

    q('svg').addEventListener('click', () => download(new Blob([view.chart(b, ks, LIGHT).s], { type: 'image/svg+xml' }), file('svg')));
    q('png').addEventListener('click', () => {
      const { s, W, H } = view.chart(b, ks, LIGHT), scale = 3, img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = W * scale; c.height = H * scale;
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob((bl) => download(bl, file('png')), 'image/png');
      };
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
    });
    q('copy').addEventListener('click', (ev) => copyHTML(view.table(b, ks, true), ev.currentTarget));
    if (b.area) {
      const inp = q('area');
      if (area) inp.value = area;
      inp.addEventListener('input', () => {
        area = parseFloat(inp.value) > 0 ? parseFloat(inp.value) : null;
        try { area ? localStorage.setItem(areaKey, area) : localStorage.removeItem(areaKey); } catch (e) {}
        renders.forEach((f) => f());
      });
    }
    render();
  }

  // --- start: restore selection from URL hash --------------------------------
  const params = new URLSearchParams(location.hash.slice(1));
  const fromHash = rows.find((r) => inputs.every((d) => params.get(d.name) === r.raw[d.i]));
  if (fromHash) sel = fromHash;

  let t;
  window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(draw, 150); });
  draw();
})();
</script>
</body>
</html>
